name: Proposer une idée
description: Une fonctionnalité ou une amélioration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: Qui est gêné, et dans quelle situation (administrateur, bénévole) ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: La proposition
      description: Ce que vous imaginez, même grossièrement.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
