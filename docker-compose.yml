# `docker compose up -d db` starts the development database only; `docker compose up -d` starts the whole production stack
# (docs/architecture/environments.md, sections 4 and 5). Image versions are fixed, never `latest`.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory and expect the mount one level up.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Runs once per update, before the application starts (environments.md, section 4, step 3).
  migrate:
    image: ghcr.io/nathanjouannon/creno-migrate:${CRENO_VERSION:-dev}
    build:
      context: .
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Daily purge of expired login attempts and reset tokens (security.md, section 4). Not started by `up`; the host's
  # cron runs it (README.md). Reuses the migrate image, which has the tooling, so no third image is published. Also
  # runs the rescue command of an administrator's password (`pnpm user:reset-link`, RG-12), hence APP_URL.
  purge:
    image: ghcr.io/nathanjouannon/creno-migrate:${CRENO_VERSION:-dev}
    profiles: ['tools']
    restart: 'no'
    command: ['pnpm', 'db:purge']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    image: ghcr.io/nathanjouannon/creno:${CRENO_VERSION:-dev}
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
