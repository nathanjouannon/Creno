    delete:
      tags:
        - Inscriptions
      operationId: unregister
      summary: Se désinscrire d'un créneau (F-08, RG-08)
      description: Supprime l'inscription de l'utilisateur connecté, tant que le créneau n'a pas commencé. La confirmation est demandée par l'interface.
