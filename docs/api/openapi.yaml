              - past
            default: upcoming
          required: false
          name: scope
          in: query
      responses:
        "200":
          description: Les événements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Événements
      operationId: createEvent
      summary: Créer un événement (F-04, F-05, F-22, RG-06, RG-07, RG-19)
      description: |-
        Administrateur seulement. Les créneaux sont facultatifs ; un événement peut être créé sans créneau.
        `registrationMode` vaut `FIXED` s'il est absent. En mode `FREE`, aucun créneau fixe n'est accepté (`EVENT_FIXED_SLOTS_NOT_ALLOWED`, RG-19).
      x-auth: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Événement créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Créneaux fixes envoyés pour un événement en mode `FREE` (`EVENT_FIXED_SLOTS_NOT_ALLOWED`, RG-19)
          x-error-codes:
            - EVENT_FIXED_SLOTS_NOT_ALLOWED
          content:
            application/json: *a3
  /events/{eventId}:
    get:
      tags:
        - Événements
      operationId: getEvent
      summary: Détail d'un événement avec ses créneaux fixes, ses créneaux libres et leurs inscrits (F-06, F-09, F-22, RG-09)
      description: Un événement passé répond `404 EVENT_NOT_FOUND` à un utilisateur, comme s'il n'existait pas ; un administrateur le voit en lecture seule.
      x-auth: user
      parameters:
        - schema:
            type: integer
            minimum: 1
          required: true
          name: eventId
          in: path
      responses:
        "200":
          description: L'événement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/EventNotFound"
    patch:
      tags:
        - Événements
      operationId: updateEvent
      summary: Modifier un événement (F-04, F-22, RG-06, RG-15, RG-19)
      description: |-
        Administrateur seulement. Champs facultatifs ; ceux envoyés remplacent les anciens. Les inscriptions sont conservées.
        Changer `registrationMode` est refusé tant que l'événement contient un type de créneau que le nouveau mode n'accepte pas : créneaux fixes en passant à `FREE`, créneaux libres en passant à `FIXED` (RG-19).
        Le changement de mode est atomique avec la création des créneaux : un créneau ne peut pas être créé dans un mode qui ne l'accepte plus.
      x-auth: admin
      parameters:
        - schema:
            type: integer
            minimum: 1
          required: true
          name: eventId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Événement modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          description: "`EVENT_PAST` (RG-15), `EVENT_MODE_HAS_SLOTS` (`details.slotCount`) ou `EVENT_MODE_HAS_FREE_SLOTS` (`details.freeSlotCount`, RG-19)"
          x-error-codes:
