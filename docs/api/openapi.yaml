            - EVENT_MODE_HAS_SLOTS
            - EVENT_MODE_HAS_FREE_SLOTS
          content:
            application/json: *a3
    delete:
      tags:
        - Événements
      operationId: deleteEvent
      summary: Supprimer un événement (F-04, RG-10, RG-15)
      description: Administrateur seulement. Supprime aussi ses créneaux, inscriptions (créneaux fixes et libres) et invitations. La confirmation qui indique le nombre d'inscrits est demandée par l'interface (RG-10), pas par l'API.
      x-auth: admin
      parameters:
