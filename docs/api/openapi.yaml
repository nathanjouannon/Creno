      description: |-
        Administrateur seulement. Un administrateur peut donner `ADMIN` à un autre utilisateur ; seul l'intéressé peut retirer son propre droit (passer à `USER`).
        Le dernier administrateur ne peut pas se retirer le droit ; le contrôle est atomique (deux retraits simultanés ne peuvent pas laisser zéro administrateur).
        Mettre un rôle déjà porté est sans effet et répond `200`.
      x-auth: admin
      parameters:
        - schema:
            type: integer
            minimum: 1
          required: true
          name: userId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/Role"
              required:
                - role
              additionalProperties: false
      responses:
        "200":
          description: Rôle à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`FORBIDDEN` (pas administrateur) ou `USER_ROLE_CHANGE_FORBIDDEN` (retirer le droit d'un autre, RG-04)"
          x-error-codes:
            - FORBIDDEN
            - USER_ROLE_CHANGE_FORBIDDEN
          content:
            application/json: *a3
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: Dernier administrateur (`USER_LAST_ADMIN`, RG-04)
          x-error-codes:
            - USER_LAST_ADMIN
          content:
            application/json: *a3
