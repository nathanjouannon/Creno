            application/json: *a3
  /invitations/{token}:
    get:
      tags:
        - Invitations
      operationId: checkInvitation
      summary: Vérifier un lien d'invitation (F-01, RG-02)
      security: []
      x-auth: public
      parameters:
        - schema:
            type: string
            minLength: 1
            description: Jeton du lien, tel que contenu dans l'URL transmise
