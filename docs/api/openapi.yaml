      description: |-
        Administrateur seulement. Champs facultatifs. `capacity: null` rend le créneau illimité.
        La limite ne peut pas être abaissée sous le nombre d'inscrits (vérification atomique avec les inscriptions concurrentes).
      x-auth: admin
      parameters:
        - schema:
            type: integer
            minimum: 1
          required: true
          name: slotId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotUpdate"
      responses:
        "200":
          description: Créneau modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SlotNotFound"
        "409":
          description: "`EVENT_PAST` (RG-15) ou `SLOT_CAPACITY_BELOW_REGISTRATIONS` (RG-07, `details.registeredCount`)"
          x-error-codes:
            - EVENT_PAST
