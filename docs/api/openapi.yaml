# Fichier généré par `pnpm api:generate` depuis packages/validation (ADR-0014). Ne pas modifier à la main : changer le schéma Zod ou le registre des routes, puis régénérer.

openapi: 3.1.0
info:
  title: API Créno
  version: 0.1.0
  description: |
    Contrat de l'API REST de Créno pour le MVP (F-01 à F-11, F-19). Référence unique pour l'interface, les tests et l'IA.

    Statut : généré depuis les schémas Zod et le registre des routes de `packages/validation` (ADR-0014), commité ici ; `pnpm api:check` échoue si le fichier commité diffère du fichier généré.

    Conventions
    - Noms des champs en camelCase, noms de domaine du `glossary.md`. Identifiants entiers (ADR-0003).
    - Dates et heures en ISO 8601 UTC (`2027-01-15T07:00:00Z`) ; l'interface les affiche dans le fuseau du club (RG-16).
    - Une réponse d'erreur suit toujours le schéma `Error` ; le client se base sur `code`, jamais sur `message` (`errors.md`).
    - Corps de requête et de réponse en `application/json`, sauf les réponses `204` qui n'ont pas de corps.
    - Pas de pagination au MVP : un club compte quelques dizaines de membres et d'événements.
    - Les états calculés (`status`, `started`, `full`, `remainingPlaces`) sont fournis par le serveur, jamais stockés (glossaire).
    - Le serveur ne renvoie pas d'avertissement de créneau hors des dates de l'événement (RG-07) : c'est l'interface qui l'affiche, la création n'est jamais refusée pour ce motif.
    - Une requête qui modifie des données est refusée (`403 FORBIDDEN_ORIGIN`) si son en-tête `Origin` n'est pas celui de l'application (`security.md`).
    - Limites de débit par adresse IP : 10 requêtes par minute sur `/setup`, `/auth/login`, `/password-resets/*` et `/invitations/*` ; 100 par minute sur le reste (`429 RATE_LIMITED` avec `Retry-After`).
    - Aucun événement asynchrone ni file de messages au MVP (ADR-0008), voir `events.md`.
    - Extensions : `x-auth` (`public`, `user` ou `admin`) donne le rôle requis par l'opération (RG-14) ; `x-error-codes` liste les codes de `errors.md` que la réponse peut porter.
servers:
  - url: /api
    description: Même origine que l'application
tags:
  - name: Installation
  - name: Authentification
  - name: Invitations
  - name: Événements
  - name: Créneaux
  - name: Inscriptions
  - name: Membres
  - name: Supervision
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        JWT dans un cookie `HttpOnly`, `Secure`, `SameSite=Lax`, chemin `/`, valable 30 jours (ADR-0006).
        Vérifié en base à chaque requête (utilisateur existant, `tokenVersion` identique). Absent ou refusé : `401 AUTH_REQUIRED`.
        En développement (hors production) le cookie s'appelle `session` et n'est pas `Secure`, pour fonctionner sur http://localhost (`security.md`, section 5).
  headers:
    SessionCookie:
      description: Pose (ou efface) le cookie de session `__Host-session`
      schema:
        type: string
  responses:
    ValidationError:
      description: Données invalides (`VALIDATION_ERROR`) ; `details.fields` liste les champs en cause
      content: &a1
        application/json: &a3
          schema:
            $ref: "#/components/schemas/Error"
      x-error-codes:
        - VALIDATION_ERROR
    Unauthenticated:
      description: Non connecté ou session refusée (`AUTH_REQUIRED`)
      content: *a1
      x-error-codes:
        - AUTH_REQUIRED
    Forbidden:
      description: Action réservée aux administrateurs (`FORBIDDEN`, RG-14)
      content: *a1
      x-error-codes:
        - FORBIDDEN
    NotFound:
      description: Ressource introuvable (`NOT_FOUND`)
      content: *a1
      x-error-codes:
        - NOT_FOUND
    EventNotFound:
      description: Événement inconnu, ou passé pour un utilisateur (`EVENT_NOT_FOUND`, RG-09)
      content: *a1
      x-error-codes:
        - EVENT_NOT_FOUND
    SlotNotFound:
      description: Créneau inconnu, ou d'un événement passé pour un utilisateur (`SLOT_NOT_FOUND`, RG-09)
      content: *a1
      x-error-codes:
        - SLOT_NOT_FOUND
    UserNotFound:
      description: Utilisateur inconnu (`USER_NOT_FOUND`)
      content: *a1
      x-error-codes:
        - USER_NOT_FOUND
    EventPast:
      description: Événement passé, donc en lecture seule (`EVENT_PAST`, RG-15)
      content: *a1
      x-error-codes:
        - EVENT_PAST
    RateLimited:
      description: Trop de requêtes (`RATE_LIMITED`)
      headers:
        Retry-After:
          description: Secondes à attendre
          schema:
            type: integer
      content: *a1
      x-error-codes:
        - RATE_LIMITED
  schemas:
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
          description: Code de champ du catalogue `errors.md`
      required:
        - field
        - code
    Error:
      type: object
      properties:
        code:
          type: string
          description: Code stable du catalogue `errors.md`
        message:
          type: string
          description: Message affichable en français ; peut changer, ne pas s'y fier
        details:
          type: object
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
              description: Pour `VALIDATION_ERROR` seulement
          additionalProperties: {}
          description: Informations propres au code (`lockedUntil`, `registeredCount`, `slotId`…)
        requestId:
          type: string
          description: Pour retrouver l'erreur dans les journaux
      required:
        - code
        - message
        - requestId
    Role:
      type: string
      enum:
        - USER
        - ADMIN
      description: Rôle de l'utilisateur
    Password:
      type: string
      minLength: 10
      description: 10 caractères minimum, aucune autre règle de complexité (RG-01). Jamais renvoyé.
    Email:
      type: string
      minLength: 1
      format: email
      description: Unique sans tenir compte de la casse ; les espaces autour sont retirés (RG-01)
    User:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - email
        - role
        - createdAt
    Club:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          description: Fuseau horaire IANA
      required:
        - name
        - timezone
    SetupInput:
      type: object
      properties:
        club:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            timezone:
              type: string
              minLength: 1
              description: Fuseau horaire IANA
          required:
            - name
            - timezone
          additionalProperties: false
        admin:
          type: object
          properties:
            firstName:
              type: string
              minLength: 1
            lastName:
              type: string
              minLength: 1
            email:
              $ref: "#/components/schemas/Email"
            password:
              $ref: "#/components/schemas/Password"
          required:
            - firstName
            - lastName
            - email
            - password
          additionalProperties: false
      required:
        - club
        - admin
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
      additionalProperties: false
    AcceptInvitationInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
      required:
        - firstName
        - lastName
        - email
        - password
      additionalProperties: false
    ShareableLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Construite avec `APP_URL` ; contient le jeton, renvoyée une seule fois
        expiresAt:
          type: string
          format: date-time
          description: Fin de validité (3 jours pour une réinitialisation, début de l'événement pour une invitation)
      required:
        - url
        - expiresAt
    EventStatus:
      type: string
      enum:
        - upcoming
        - ongoing
        - past
      description: Calculé. `upcoming` avant le début, `ongoing` entre début et fin, `past` après la fin.
    RegistrationMode:
      type: string
      enum:
        - FIXED
        - FREE
        - BOTH
      description: "Mode d'inscription (RG-19) : `FIXED` créneaux fixes seulement (défaut), `FREE` créneaux libres seulement, `BOTH` les deux (les créneaux fixes sont alors indicatifs)"
    EventSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        location:
          type:
            - string
            - "null"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/EventStatus"
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        slotCount:
          type: integer
          minimum: 0
          description: Nombre de créneaux fixes
      required:
        - id
        - title
        - location
        - startsAt
        - endsAt
        - status
        - registrationMode
        - slotCount
    Attendee:
      type: object
      properties:
        registrationId:
          type: integer
          description: Sert à l'administrateur pour retirer l'inscription
        displayName:
          type:
            - string
            - "null"
          description: « Prénom N. » (RG-09) ; `null` pour une inscription anonymisée (RG-11), que l'interface affiche « ancien membre »
        isMe:
          type: boolean
          description: Vrai pour l'inscription de l'utilisateur connecté
      required:
        - registrationId
        - displayName
        - isMe
    Slot:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type:
            - integer
            - "null"
          description: "`null` = places illimitées"
        description:
          type:
            - string
            - "null"
          description: Texte brut (jamais interprété), `null` = sans description (RG-07, F-21)
        registeredCount:
          type: integer
          minimum: 0
        remainingPlaces:
          type:
            - integer
            - "null"
          description: "`capacity` moins `registeredCount` ; `null` pour un créneau illimité"
        full:
          type: boolean
          description: Vrai seulement pour un créneau limité dont la capacité est atteinte
        started:
          type: boolean
          description: Vrai si l'heure courante est supérieure ou égale au début du créneau (RG-08)
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
      required:
        - id
        - eventId
        - startsAt
        - endsAt
        - capacity
        - description
        - registeredCount
        - remainingPlaces
        - full
        - started
        - attendees
    FreeSlot:
      type: object
      properties:
        id:
          type: integer
          description: Identifiant de l'inscription ; sert aussi à `DELETE /registrations/{registrationId}` (retrait par un administrateur)
        eventId:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        started:
          type: boolean
          description: Vrai si l'heure courante est supérieure ou égale au début (RG-08, RG-20)
        displayName:
          type:
            - string
            - "null"
          description: « Prénom N. » (RG-09) ; `null` pour une inscription anonymisée (RG-11), que l'interface affiche « ancien membre »
        isMe:
          type: boolean
          description: Vrai pour un créneau libre de l'utilisateur connecté
      required:
        - id
        - eventId
        - startsAt
        - endsAt
        - started
        - displayName
        - isMe
      description: "Créneau libre (F-22, RG-20) : inscription sans créneau fixe, avec les horaires choisis par l'utilisateur. Ni limite de places, ni état « complet »."
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            description:
              type:
                - string
                - "null"
            slots:
              type: array
              items:
                $ref: "#/components/schemas/Slot"
              description: Créneaux fixes, triés par date de début croissante
            freeSlots:
              type: array
              items:
                $ref: "#/components/schemas/FreeSlot"
              description: Créneaux libres (F-22), triés par début, fin puis `id` croissants ; vide en mode `FIXED`
          required:
            - description
            - slots
            - freeSlots
    SlotInput:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Après `startsAt` (RG-07)
        capacity:
          type:
            - integer
            - "null"
          minimum: 1
          default: null
          description: Nombre de places ; `null` ou absent = illimité (RG-07)
        description:
          type:
            - string
            - "null"
          maxLength: 500
          description: Texte brut de 500 caractères au plus ; vide ou `null` = sans description (RG-07)
      required:
        - startsAt
        - endsAt
      additionalProperties: false
    EventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Après `startsAt` (RG-06)
        registrationMode:
          allOf:
            - $ref: "#/components/schemas/RegistrationMode"
            - default: FIXED
              description: Mode d'inscription (RG-19) ; `FIXED` s'il est absent
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotInput"
          default: []
          description: Créneaux fixes ; refusés en mode `FREE` (RG-19)
      required:
        - title
        - startsAt
        - endsAt
      additionalProperties: false
    EventUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
      additionalProperties: false
      minProperties: 1
    SlotUpdate:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type:
            - integer
            - "null"
          minimum: 1
        description:
          type:
            - string
            - "null"
          maxLength: 500
          description: Texte brut de 500 caractères au plus ; vide ou `null` = sans description (RG-07)
      additionalProperties: false
      minProperties: 1
    UpdateProfileInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          $ref: "#/components/schemas/Email"
        currentPassword:
          type: string
          description: Exigé seulement quand l'e-mail change (RG-18) ; jamais renvoyé
      required:
        - firstName
        - lastName
        - email
      additionalProperties: false
    FreeSlotInput:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
          description: Strictement après l'heure courante, dans les dates de l'événement
        endsAt:
          type: string
          format: date-time
          description: Au moins 30 minutes après `startsAt`, au plus tard à la fin de l'événement (RG-20)
      required:
        - startsAt
        - endsAt
      additionalProperties: false
  parameters: {}
paths:
  /setup:
    post:
      tags:
        - Installation
      operationId: setup
      summary: Installer l'instance (F-19, RG-17)
      description: |-
        Crée le club et le premier administrateur, atomiquement, puis ouvre sa session.
        Disponible seulement tant qu'aucun utilisateur n'existe ; ensuite répond `404 NOT_FOUND`.
        Si deux installations arrivent en même temps, une seule aboutit, l'autre reçoit `404 NOT_FOUND`.
        Avant l'installation, l'interface redirige toutes ses pages vers la page d'installation (contrôle côté serveur Next.js, pas d'endpoint dédié).
      security: []
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Club et administrateur créés, session ouverte
          headers: &a2
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /club:
    get:
      tags:
        - Installation
      operationId: getClub
      summary: Nom et fuseau horaire du club (RG-16)
      x-auth: user
      responses:
        "200":
          description: Le club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/login:
    post:
      tags:
        - Authentification
      operationId: login
      summary: Se connecter (F-02, RG-03)
      description: |-
        Après 5 échecs consécutifs avec la même adresse saisie, la connexion avec cette adresse est bloquée 15 minutes, même avec le bon mot de passe.
        La réponse est identique que l'adresse ait un compte ou non, et le temps de réponse ne doit pas le trahir (`security.md`).
        Une connexion réussie remet le compteur à zéro. Le retour à la page demandée est géré par l'interface.
      security: []
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connecté
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: E-mail ou mot de passe incorrect (`AUTH_INVALID_CREDENTIALS`)
          x-error-codes:
            - AUTH_INVALID_CREDENTIALS
          content:
            application/json: *a3
        "423":
          description: Adresse bloquée (`AUTH_ACCOUNT_LOCKED`, RG-03). `details.lockedUntil` donne la fin du blocage.
          x-error-codes:
            - AUTH_ACCOUNT_LOCKED
          content:
            application/json: *a3
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      tags:
        - Authentification
      operationId: logout
      summary: Se déconnecter (F-02)
      description: Efface le cookie de session. Répond `204` même si la session était déjà expirée.
      security: []
      x-auth: public
      responses:
        "204":
          description: Déconnecté
          headers: *a2
  /me:
    get:
      tags:
        - Authentification
      operationId: getMe
      summary: Utilisateur connecté
      description: Le rôle renvoyé est lu en base à chaque requête, pas dans le jeton (ADR-0006).
      x-auth: user
      responses:
        "200":
          description: L'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags:
        - Authentification
      operationId: updateMe
      summary: Modifier son nom, son prénom ou son e-mail (F-20, RG-18)
      description: |-
        Les trois champs sont renvoyés à chaque appel. `currentPassword` n'est exigé que si l'e-mail change : absent, `VALIDATION_ERROR` sur `currentPassword` (`FIELD_REQUIRED`) ; faux, `VALIDATION_ERROR` (`FIELD_PASSWORD_INCORRECT`).
        La session ouverte reste valable. Aucun e-mail n'est envoyé (RG-13).
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: L'utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: Adresse déjà utilisée (`USER_EMAIL_IN_USE`, RG-01)
          x-error-codes:
            - USER_EMAIL_IN_USE
          content:
            application/json: *a3
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - Authentification
      operationId: deleteMe
      summary: Supprimer son compte (F-11, RG-11)
      description: |-
        Efface le nom, le prénom et l'e-mail ; libère les inscriptions des créneaux qui n'ont pas commencé ; anonymise celles des créneaux commencés (« ancien membre »).
        Efface le cookie de session. Refusé pour le dernier administrateur (RG-04). La confirmation est demandée par l'interface, pas par l'API.
      x-auth: user
      responses:
        "204":
          description: Compte supprimé
          headers: *a2
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: Dernier administrateur (`USER_LAST_ADMIN`, RG-04)
          x-error-codes:
            - USER_LAST_ADMIN
          content:
            application/json: *a3
  /me/deletion-check:
    get:
      tags:
        - Authentification
      operationId: checkAccountDeletion
      summary: Vérifier que son compte peut être supprimé (F-11, RG-04)
      description: Ne supprime rien. Permet à l'interface de refuser dès le clic, sans écran de confirmation, le dernier administrateur ; `DELETE /me` refait le contrôle dans sa transaction.
      x-auth: user
      responses:
        "204":
          description: Le compte peut être supprimé
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: Dernier administrateur (`USER_LAST_ADMIN`, RG-04)
          x-error-codes:
            - USER_LAST_ADMIN
          content:
            application/json: *a3
  /password-resets/{token}:
    get:
      tags:
        - Authentification
      operationId: checkPasswordReset
      summary: Vérifier un lien de réinitialisation (F-02, RG-12)
      description: Permet à l'interface d'afficher le formulaire ou le message « Ce lien n'est plus valide ».
      security: []
      x-auth: public
      parameters:
        - schema:
            type: string
            minLength: 1
            description: Jeton du lien, tel que contenu dans l'URL transmise
          required: true
          description: Jeton du lien, tel que contenu dans l'URL transmise
          name: token
          in: path
      responses:
        "200":
          description: Lien valide
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: string
                    format: date-time
                required:
                  - expiresAt
        "410":
          description: Lien inconnu, expiré, déjà utilisé ou remplacé (`AUTH_RESET_LINK_INVALID`)
          x-error-codes: &a4
            - AUTH_RESET_LINK_INVALID
          content:
            application/json: *a3
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Authentification
