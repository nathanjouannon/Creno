            application/json: *a3
    delete:
      tags:
        - Créneaux
      operationId: deleteSlot
      summary: Supprimer un créneau (F-05, RG-10, RG-15)
      description: Administrateur seulement. Supprime ses inscriptions. La confirmation est demandée par l'interface (RG-10). Supprimer le dernier créneau conserve l'événement (RG-06).
