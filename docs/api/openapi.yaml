            minimum: 1
          required: true
          name: eventId
          in: path
      responses:
        "204":
          description: Événement supprimé
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          $ref: "#/components/responses/EventPast"
  /events/{eventId}/slots:
