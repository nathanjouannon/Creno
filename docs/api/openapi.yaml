          name: freeSlotId
          in: path
      responses:
        "204":
          description: Désinscrit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Créneau libre inconnu, d'un autre utilisateur, ou d'un événement passé pour un utilisateur (`FREE_SLOT_NOT_FOUND`)
          x-error-codes:
            - FREE_SLOT_NOT_FOUND
          content:
            application/json: *a3
        "409":
          description: "`FREE_SLOT_STARTED` (RG-08, RG-20) ou `EVENT_PAST` (RG-15, administrateur seulement)"
          x-error-codes:
            - FREE_SLOT_STARTED
            - EVENT_PAST
          content:
            application/json: *a3
