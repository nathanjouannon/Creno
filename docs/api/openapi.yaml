          description: Inscription retirée
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Inscription inconnue (`REGISTRATION_NOT_FOUND`)
          x-error-codes:
            - REGISTRATION_NOT_FOUND
          content:
            application/json: *a3
        "409":
          $ref: "#/components/responses/EventPast"
  /events/{eventId}/free-slots:
    post:
      tags:
        - Inscriptions
      operationId: createFreeSlot
      summary: "Choisir ses horaires : créer son créneau libre (F-22, RG-19, RG-20)"
      description: |-
        Inscrit l'utilisateur connecté, administrateur compris, sur les horaires qu'il choisit. L'événement doit être en mode `FREE` ou `BOTH`.
        Horaires dans les dates de l'événement, durée d'au moins 30 minutes, début strictement après l'heure courante : sinon `VALIDATION_ERROR` avec `FIELD_FREE_SLOT_OUT_OF_EVENT`, `FIELD_FREE_SLOT_TOO_SHORT`, `FIELD_END_NOT_AFTER_START` ou `FIELD_START_NOT_IN_FUTURE`.
        Plusieurs créneaux libres par utilisateur et par événement, à condition qu'ils ne se recouvrent pas (se toucher est permis). Ni limite de places, ni état « complet ».
        Atomique : deux demandes simultanées du même utilisateur ne laissent jamais deux créneaux libres qui se recouvrent, et un changement de mode simultané est pris en compte.
      x-auth: user
      parameters:
        - schema:
            type: integer
            minimum: 1
          required: true
          name: eventId
          in: path
      requestBody:
        required: true
        content:
