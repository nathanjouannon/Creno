            - REGISTRATION_NOT_FOUND
          content:
            application/json: *a3
        "409":
          description: "`SLOT_STARTED` (RG-08) ou `EVENT_PAST` (RG-15, administrateur seulement)"
          x-error-codes:
            - SLOT_STARTED
            - EVENT_PAST
          content:
            application/json: *a3
