            minimum: 1
          required: true
          name: slotId
          in: path
      responses:
        "204":
          description: Désinscrit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Créneau inconnu (`SLOT_NOT_FOUND`) ou utilisateur non inscrit (`REGISTRATION_NOT_FOUND`)
          x-error-codes:
