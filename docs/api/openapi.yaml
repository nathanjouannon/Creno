        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          description: "`EVENT_FREE_SLOTS_NOT_ALLOWED` (mode `FIXED`, RG-19), `FREE_SLOT_OVERLAP` (RG-20, `details.freeSlotId`) ou `EVENT_PAST` (RG-15, administrateur seulement, un utilisateur reçoit `404`)"
          x-error-codes:
            - EVENT_FREE_SLOTS_NOT_ALLOWED
            - FREE_SLOT_OVERLAP
            - EVENT_PAST
          content:
            application/json: *a3
